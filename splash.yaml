flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#272727"
  image: assets/logos/t-store-splash-logo-black.png
  image_dark: assets/logos/t-store-splash-logo-white.png

  android_12:
    color: "#FFFFFF"
    color_dark: "#272727"
    image: assets/logos/t-store-splash-logo-black.png
    image_dark: assets/logos/t-store-splash-logo-white.png

  web: false

  #--------------------------To create Flutter Native Splash -----------------#
  #--------------------------Run below Command to terminal   -----------------#
  #--flutter pub run flutter_native_splash:create --path=splash.yaml      ----#


  #--------------------------To remove Flutter Native Splash -----------------#
  #--------------------------Run below Command to terminal   -----------------#
  #--flutter pub run flutter_native_splash:remove            -----------------#

  #--------------------------To Fix Flutter Files  -----------------#
  #-- dart fix --dry-run--------------------------------------------#

  #--------------------------To Remove Unused Imports from Files  -----------------#
  #-- dart fix --apply --code=unused_import----------------------------------------#
  #--------------------------For overall file fixes  -----------------#
  #-- dart fix --apply ----------------------------------------#
